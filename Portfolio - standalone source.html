<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marcos Vinícius — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #030915;
    --ink: #FFFFFF;
    --ink-dim: rgba(255, 255, 255, 0.58);
    --ink-dimmer: rgba(255, 255, 255, 0.32);
    --primary: #0A1F4D;
    --primary-deep: #050E26;
    --accent: #4D7FFF;
    --hairline: rgba(255, 255, 255, 0.10);
    --hairline-strong: rgba(255, 255, 255, 0.22);
    --panel: rgba(3, 9, 21, 0.45);
    --panel-blur: 18px;
    --sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    cursor: default;
  }
  a { color: inherit; text-decoration: none; }
  button { background: none; border: none; color: inherit; cursor: pointer; font: inherit; }
  .mono { font-family: var(--mono); font-weight: 400; letter-spacing: 0.02em; }
  .small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .dim { color: var(--ink-dim); }

  /* Wallpaper layer */
  .wallpaper {
    position: fixed; inset: 0;
    z-index: 0;
    background: var(--bg);
  }
  .wallpaper canvas { width: 100%; height: 100%; display: block; }
  .wallpaper-tint {
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 0%, transparent 30%, rgba(3,9,21,0.35) 100%),
      radial-gradient(ellipse at 50% 100%, transparent 30%, rgba(3,9,21,0.45) 100%);
  }

  /* Frame */
  .frame {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* Status bar */
  .statusbar {
    position: sticky; top: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 14px 24px;
    background: rgba(3, 9, 21, 0.4);
    backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    border-bottom: 1px solid var(--hairline);
    z-index: 10;
  }
  .statusbar-left, .statusbar-right { display: flex; align-items: center; gap: 10px; }
  .statusbar-right { justify-content: flex-end; }
  .statusbar-center { text-align: center; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent), 0 0 16px rgba(217, 42, 107, 0.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  .lang-pill {
    padding: 4px 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }
  .lang-pill:hover { color: var(--ink); }
  .lang-pill.on { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
  .lang-sep { color: var(--ink-dimmer); font-family: var(--mono); font-size: 11px; }
  .time { margin-left: 8px; }

  /* Content */
  .content {
    flex: 1;
    max-width: 1080px;
    width: 100%;
    margin: 0 auto;
    padding: 80px 32px 200px;
    display: flex;
    flex-direction: column;
    gap: 120px;
  }

  /* Hero */
  .hero { display: flex; flex-direction: column; gap: 24px; }
  .hero-meta { display: flex; gap: 24px; align-items: center; }
  .hero-name {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(64px, 12vw, 168px);
    line-height: 0.92;
    letter-spacing: -0.02em;
    display: flex;
    flex-direction: column;
  }
  .hero-first {}
  .hero-last { font-style: italic; color: var(--ink); position: relative; }
  .hero-last::after {
    content: '';
    display: inline-block;
    width: 0.18em; height: 0.18em;
    background: var(--accent);
    border-radius: 50%;
    margin-left: 0.08em;
    transform: translateY(-0.08em);
  }
  .hero-intro {
    max-width: 56ch;
    font-size: clamp(16px, 1.6vw, 20px);
    color: rgba(255, 255, 255, 0.78);
    text-wrap: pretty;
    margin-top: 16px;
  }

  /* Section blocks */
  .block { display: flex; flex-direction: column; gap: 32px; }
  .block-head {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 24px;
    align-items: end;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--hairline);
  }
  .block-tag {
    display: flex; gap: 12px; align-items: baseline;
    color: var(--ink);
  }
  .tag-num { color: var(--accent); }
  .block-cap {
    font-size: 14px;
    color: var(--ink-dim);
    max-width: 40ch;
  }

  /* Stack */
  .stack-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--hairline);
    border: 1px solid var(--hairline);
  }
  .stack-card {
    background: rgba(3, 9, 21, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 28px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 140px;
    transition: background 0.3s;
  }
  .stack-card:hover { background: rgba(10, 31, 77, 0.55); }
  .stack-num { margin-bottom: 36px; }
  .stack-name {
    font-family: var(--serif);
    font-size: 32px;
    line-height: 1;
    font-weight: 400;
  }

  /* Projects */
  .proj-controls { display: flex; gap: 6px; }
  .ctrl {
    width: 32px; height: 32px;
    border: 1px solid var(--hairline-strong);
    border-radius: 50%;
    color: var(--ink-dim);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .ctrl:hover { color: var(--ink); border-color: var(--ink-dim); background: rgba(255,255,255,0.05); }
  .proj-track {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(360px, 420px);
    gap: 16px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 0 16px;
    scroll-snap-type: x mandatory;
    scrollbar-width: thin;
    scrollbar-color: var(--hairline-strong) transparent;
  }
  .proj-track::-webkit-scrollbar { height: 4px; }
  .proj-track::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 2px; }

  .proj-card {
    scroll-snap-align: start;
    background: rgba(3, 9, 21, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    min-height: 320px;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s, background 0.3s;
    cursor: pointer;
  }
  .proj-card:hover {
    transform: translateY(-4px);
    border-color: var(--hairline-strong);
    background: rgba(10, 31, 77, 0.45);
  }
  .proj-card-head {
    display: flex; justify-content: space-between; align-items: center;
  }
  .proj-sub { color: var(--accent); }
  .proj-card-body { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .proj-title {
    font-family: var(--serif);
    font-size: 44px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .proj-desc {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.72);
    text-wrap: pretty;
  }
  .proj-card-foot {
    display: flex; justify-content: space-between; align-items: end;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
  }
  .proj-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .proj-link svg {
    transition: transform 0.3s;
  }
  .proj-card:hover .proj-link svg {
    transform: translate(2px, -2px);
  }
  .proj-url { font-size: 10px; max-width: 60%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Contact */
  .contact-rows {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--hairline);
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
  }
  .contact-row {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 24px;
    padding: 24px 8px;
    background: rgba(3, 9, 21, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    align-items: center;
  }
  .contact-val {
    display: flex; align-items: center; gap: 16px;
    font-family: var(--mono);
    font-size: 16px;
  }
  .contact-val a { display: inline-flex; align-items: center; transition: color 0.2s; }
  .contact-val a:hover { color: var(--accent); }
  .copy-btn {
    padding: 4px 10px;
    border: 1px solid var(--hairline-strong);
    border-radius: 3px;
    color: var(--ink-dim);
    transition: color 0.2s, border-color 0.2s;
  }
  .copy-btn:hover { color: var(--ink); border-color: var(--ink-dim); }

  /* Role */
  .role-body { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
  .role-card {
    background: rgba(3, 9, 21, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--hairline);
    padding: 28px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .role-card-head {
    display: flex; justify-content: space-between; align-items: start; gap: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .role-company {
    font-family: var(--serif);
    font-size: 36px;
    line-height: 1;
    font-weight: 400;
    margin-bottom: 6px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid rgba(77, 127, 255, 0.4);
    background: rgba(77, 127, 255, 0.1);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }
  .small-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }
  .role-lead {
    font-family: var(--serif);
    font-size: 24px;
    line-height: 1.25;
    text-wrap: balance;
  }
  .role-desc {
    font-size: 14px;
    color: rgba(255,255,255,0.72);
    text-wrap: pretty;
  }
  .role-points {
    display: flex; flex-direction: column;
    gap: 1px;
    background: var(--hairline);
    border: 1px solid var(--hairline);
  }
  .role-point {
    background: rgba(3, 9, 21, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 16px 20px;
    display: flex; flex-direction: column; gap: 4px;
    transition: background 0.3s;
  }
  .role-point:hover { background: rgba(10, 31, 77, 0.5); }
  .role-point-head { display: flex; align-items: baseline; gap: 12px; }
  .role-point-key {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .role-point-desc {
    font-size: 13px;
    line-height: 1.5;
    color: rgba(255,255,255,0.7);
    margin-left: 28px;
    text-wrap: pretty;
  }

  /* Education */
  .edu-list {
    display: flex; flex-direction: column;
    gap: 1px;
    background: var(--hairline);
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
  }
  .edu-row {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 24px;
    padding: 22px 8px;
    background: rgba(3, 9, 21, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    align-items: center;
    transition: background 0.3s;
  }
  .edu-row:hover { background: rgba(10, 31, 77, 0.45); }
  .edu-degree {
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .edu-school { line-height: 1.4; }
  .edu-status {
    color: var(--accent);
    border: 1px solid rgba(77, 127, 255, 0.4);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(77, 127, 255, 0.08);
  }

  @media (max-width: 800px) {
    .role-body { grid-template-columns: 1fr; }
    .edu-row { grid-template-columns: 30px 1fr; }
    .edu-status { grid-column: 2; justify-self: start; margin-top: 4px; }
  }

  /* AI Engineering */
  .ai-body { display: flex; flex-direction: column; gap: 32px; }
  .ai-lead {
    font-family: var(--serif);
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    max-width: 22ch;
    text-wrap: balance;
  }
  .ai-desc {
    font-size: clamp(15px, 1.4vw, 17px);
    color: rgba(255, 255, 255, 0.72);
    max-width: 64ch;
    text-wrap: pretty;
  }
  .ai-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--hairline);
    border: 1px solid var(--hairline);
    margin-top: 8px;
  }
  .ai-pill {
    background: rgba(3, 9, 21, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 22px 22px 24px;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 130px;
    transition: background 0.3s;
  }
  .ai-pill:hover { background: rgba(10, 31, 77, 0.55); }
  .ai-pill-head {
    display: flex; align-items: baseline; gap: 12px;
  }
  .ai-pill-key {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .ai-pill-desc {
    font-size: 13px;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.72);
    text-wrap: pretty;
  }
  @media (max-width: 800px) {
    .ai-grid { grid-template-columns: 1fr; }
  }

  /* Footer */
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
  }

  /* Dock */
  .dock {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(3, 9, 21, 0.6);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 10px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 540px;
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.7);
  }
  .dock-label { padding: 0 4px; }
  .dock-pills { display: flex; gap: 4px; }
  .dock-pill {
    flex: 1;
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s, background 0.2s;
    white-space: nowrap;
  }
  .dock-pill:hover { color: var(--ink); background: rgba(255,255,255,0.06); }
  .dock-pill.active {
    color: var(--ink);
    background: rgba(77, 127, 255, 0.18);
    box-shadow: inset 0 0 0 1px rgba(77, 127, 255, 0.55);
  }
  .dock-num { font-size: 10px; opacity: 0.7; }
  .dock-name { font-size: 12px; letter-spacing: 0.02em; }
  .dock-hint {
    text-align: center;
    padding: 2px 4px 4px;
    height: 14px;
    transition: opacity 0.3s;
  }

  /* Responsive */
  @media (max-width: 800px) {
    .content { padding: 48px 20px 220px; gap: 80px; }
    .stack-grid { grid-template-columns: repeat(2, 1fr); }
    .block-head { grid-template-columns: 1fr; gap: 12px; }
    .proj-controls { justify-self: start; }
    .contact-row { grid-template-columns: 100px 1fr; padding: 20px 8px; }
    .contact-val { font-size: 13px; flex-wrap: wrap; gap: 10px; }
    .dock { min-width: unset; left: 12px; right: 12px; transform: none; }
    .dock-pills { overflow-x: auto; scrollbar-width: none; }
    .dock-pills::-webkit-scrollbar { display: none; }
    .dock-pill { flex: 0 0 auto; }
    .statusbar-center { display: none; }
    .statusbar { grid-template-columns: 1fr 1fr; }
    .proj-card { min-height: 280px; }
    .proj-title { font-size: 32px; }
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#030915">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
          <stop offset="40%" stop-color="#4D7FFF" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#030915" stop-opacity="0" />
        </radialGradient>
      </defs>
      <rect width="1200" height="800" fill="#030915" />
      <circle cx="600" cy="400" r="280" fill="url(#g)" />
      <text x="600" y="415" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif"
            font-style="italic" font-size="120" fill="#FFFFFF">MV</text>
    </svg>
  </template>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="shaders.js"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
